{% extends "base.html" %}

{% block content %}
<h2>Your Files</h2>

<a href="/upload" class="btn btn-primary mb-3">Upload File</a>

<table class="table table-bordered table-hover">
<tr>
    <th>File Name</th>
    <th>Uploaded At</th>
    <th>Action</th>
</tr>

{% for file in files %}
<tr>
    <td>{{ file[1] }}</td>
    <td>{{ file[2] }}</td>
    <td>
        <a href="/download/{{ file[0] }}" class="btn btn-success btn-sm">Download</a>
    </td>
</tr>
{% else %}
<tr>
    <td colspan="3" class="text-center">No files uploaded</td>
</tr>
{% endfor %}

</table>
{% endblock %}
